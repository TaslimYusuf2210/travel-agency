<div class="min-h-screen p-4 sm:p-6 lg:p-8 font-sans">
  <!-- Hero Card Container -->
  <section class="relative mx-auto max-w-[1360px] overflow-hidden rounded-[24px] shadow-xl">
    <!-- Hero Image Background -->
    <div
      class="absolute inset-0 bg-cover bg-center transition-transform duration-700 hover:scale-[1.01]"
      style="background-image: url('/homeHero.jpg');"
      aria-hidden="true"
    ></div>
    <!-- Dark Overlay Gradient -->
    <div
      class="absolute inset-0 bg-gradient-to-b from-black/55 via-black/30 to-black/60"
      aria-hidden="true"
    ></div>

    <!-- Integrated Navigation Bar inside Hero -->
    <header class="relative z-20 flex items-center justify-between px-6 py-6 sm:px-10 lg:px-12">
      <!-- Left Navigation Items -->
      <nav class="flex items-center gap-8 text-sm font-semibold text-white">
        <button
          (click)="setTab('flights')"
          class="flex items-center gap-2 hover:opacity-85 transition cursor-pointer"
        >
          <!-- Flight Icon -->
          <svg class="h-6 w-6" viewBox="0 0 24 24">
            <path d="M0 0h24v24H0z" fill="none" />
            <path fill="currentColor" d="M20.56 3.91c.59.59.59 1.54 0 2.12l-3.89 3.89l2.12 9.19l-1.41 1.42l-3.88-7.43L9.6 17l.36 2.47l-1.07 1.06l-1.76-3.18l-3.19-1.77L5 14.5l2.5.37L11.37 11L3.94 7.09l1.42-1.41l9.19 2.12l3.89-3.89c.56-.58 1.56-.58 2.12 0"/>
          </svg>
          <span>Find Flight</span>
        </button>
        <button
          (click)="setTab('stays')"
          class="flex items-center gap-2 hover:opacity-85 transition cursor-pointer"
        >
          <!-- Bed / Stays Icon -->
          <svg class="h-6 w-6" viewBox="0 0 24 24">
            <path d="M0 0h24v24H0z" fill="none" />
            <path fill="currentColor" d="M2 19v-6q0-.675.275-1.225T3 10.8V8q0-1.25.875-2.125T6 5h4q.575 0 1.075.213T12 5.8q.425-.375.925-.587T14 5h4q1.25 0 2.125.875T21 8v2.8q.45.425.725.975T22 13v6h-2v-2H4v2zm11-9h6V8q0-.425-.288-.712T18 7h-4q-.425 0-.712.288T13 8zm-8 0h6V8q0-.425-.288-.712T10 7H6q-.425 0-.712.288T5 8z"/>
          </svg>
          <span>Find Stays</span>
        </button>
      </nav>

      <!-- Center Logo -->
      <div class="flex items-center justify-center">
        <a routerLink="/" class="inline-block transition-transform hover:scale-105">
          <img src="/Logo.png" alt="Golobe Logo" class="h-9 w-auto" />
        </a>
      </div>

      <!-- Right Auth Actions -->
      <div class="flex items-center gap-6 text-sm font-semibold text-white">
        <a routerLink="/login" class="hover:opacity-85 transition cursor-pointer">Login</a>
        <a
          routerLink="/create-account"
          class="rounded-[8px] bg-white px-6 py-2.5 text-sm font-semibold text-[#112211] shadow-sm hover:bg-gray-100 transition-all cursor-pointer"
        >
          Sign up
        </a>
      </div>
    </header>

    <!-- Main Hero Centered Headlines -->
    <div class="relative z-10 mx-auto max-w-4xl px-4 pt-16 pb-36 text-center text-white sm:pt-20 sm:pb-44 lg:pt-24 lg:pb-48">
      <h2 class="text-xl sm:text-2xl lg:text-5xl font-bold tracking-normal text-white drop-shadow-sm font-display">
        Helping Others
      </h2>
      <h1 class="mt-2 font-display text-5xl font-extrabold tracking-[0.08em] sm:text-6xl lg:text-[80px] text-white uppercase drop-shadow-md leading-none">
        LIVE &amp; TRAVEL
      </h1>
      <p class="mt-3 text-base sm:text-lg lg:text-[20px] font-semibold text-white/95 drop-shadow-sm font-sans">
        Special offers to suit your plan
      </p>
    </div>
  </section>

  <!-- Floating Search Form Card (Overlapping Hero Banner) -->
  <section class="relative z-30 mx-auto -mt-24 sm:-mt-28 max-w-6xl px-4 sm:px-6">
    <div class="rounded-[16px] bg-white p-6 sm:p-8 shadow-[0_4px_30px_rgba(0,0,0,0.1)] border border-gray-100/80 backdrop-blur-sm">
      <!-- Search Tabs Header -->
      <div class="flex items-center justify-between border-b border-gray-200 pb-5">
        <div class="flex items-center gap-8">
          <!-- Flights Tab -->
          <button
            type="button"
            (click)="setTab('flights')"
            class="relative flex items-center gap-2 pb-3 text-base font-semibold transition cursor-pointer"
            [class.text-[#112211]]="activeTab() === 'flights'"
            [class.text-gray-500]="activeTab() !== 'flights'"
          >
            <svg class="h-5 w-5" viewBox="0 0 24 24">
              <path d="M0 0h24v24H0z" fill="none" />
              <path fill="currentColor" d="M20.56 3.91c.59.59.59 1.54 0 2.12l-3.89 3.89l2.12 9.19l-1.41 1.42l-3.88-7.43L9.6 17l.36 2.47l-1.07 1.06l-1.76-3.18l-3.19-1.77L5 14.5l2.5.37L11.37 11L3.94 7.09l1.42-1.41l9.19 2.12l3.89-3.89c.56-.58 1.56-.58 2.12 0"/>
            </svg>
            <span>Flights</span>
            @if (activeTab() === 'flights') {
              <span class="absolute bottom-0 left-0 right-0 h-[4px] rounded-full bg-[#8DD3BB]"></span>
            }
          </button>

          <!-- Divider -->
          <div class="h-6 w-[1px] bg-gray-200"></div>

          <!-- Stays Tab -->
          <button
            type="button"
            (click)="setTab('stays')"
            class="relative flex items-center gap-2 pb-3 text-base font-semibold transition cursor-pointer"
            [class.text-[#112211]]="activeTab() === 'stays'"
            [class.text-gray-500]="activeTab() !== 'stays'"
          >
            <svg class="h-5 w-5" viewBox="0 0 24 24">
              <path d="M0 0h24v24H0z" fill="none" />
              <path fill="currentColor" d="M2 19v-6q0-.675.275-1.225T3 10.8V8q0-1.25.875-2.125T6 5h4q.575 0 1.075.213T12 5.8q.425-.375.925-.587T14 5h4q1.25 0 2.125.875T21 8v2.8q.45.425.725.975T22 13v6h-2v-2H4v2zm11-9h6V8q0-.425-.288-.712T18 7h-4q-.425 0-.712.288T13 8zm-8 0h6V8q0-.425-.288-.712T10 7H6q-.425 0-.712.288T5 8z"/>
            </svg>
            <span>Stays</span>
            @if (activeTab() === 'stays') {
              <span class="absolute bottom-0 left-0 right-0 h-[4px] rounded-full bg-[#8DD3BB]"></span>
            }
          </button>
        </div>
      </div>

      <!-- Search Inputs Grid (Fieldset Outlined Style) -->
      <form (submit)="$event.preventDefault()" class="mt-8">
        <div class="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-4">
          
          <!-- Field 1: From - To -->
          <div class="relative">
            <label class="absolute -top-2.5 left-3 z-10 bg-white px-1 text-xs font-semibold text-[#112211]">
              From - To
            </label>
            <div class="flex h-[56px] items-center justify-between rounded-[4px] border border-[#79747E] bg-white px-3 py-2 transition-all focus-within:border-[#8DD3BB] focus-within:ring-1 focus-within:ring-[#8DD3BB]">
              <input
                type="text"
                [ngModel]="fromLocation() + ' - ' + toLocation()"
                (ngModelChange)="fromLocation.set($event)"
                name="fromTo"
                class="w-full bg-transparent text-sm font-medium text-[#112211] outline-none"
              />
              <!-- Swap Button -->
              <button
                type="button"
                (click)="swapLocations()"
                title="Swap origin and destination"
                class="ml-2 flex h-8 w-8 shrink-0 items-center justify-center rounded-full text-[#112211] hover:bg-gray-100 hover:text-[#74C0A3] transition-colors cursor-pointer"
              >
                <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Field 2: Trip -->
          <div class="relative">
            <label class="absolute -top-2.5 left-3 z-10 bg-white px-1 text-xs font-semibold text-[#112211]">
              Trip
            </label>
            <div class="relative flex h-[56px] items-center rounded-[4px] border border-[#79747E] bg-white px-3 py-2 transition-all focus-within:border-[#8DD3BB] focus-within:ring-1 focus-within:ring-[#8DD3BB]">
              <select
                [ngModel]="tripType()"
                (ngModelChange)="tripType.set($event)"
                name="tripType"
                class="w-full appearance-none bg-transparent text-sm font-medium text-[#112211] outline-none cursor-pointer pr-8"
              >
                <option value="Return">Return</option>
                <option value="One Way">One Way</option>
                <option value="Multi-City">Multi-City</option>
              </select>
              <div class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-[#112211]">
                <svg class="h-4 w-4 fill-current" viewBox="0 0 20 20">
                  <path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"/>
                </svg>
              </div>
            </div>
          </div>

          <!-- Field 3: Depart - Return -->
          <div class="relative">
            <label class="absolute -top-2.5 left-3 z-10 bg-white px-1 text-xs font-semibold text-[#112211]">
              Depart- Return
            </label>
            <div class="flex h-[56px] items-center rounded-[4px] border border-[#79747E] bg-white px-3 py-2 transition-all focus-within:border-[#8DD3BB] focus-within:ring-1 focus-within:ring-[#8DD3BB]">
              <input
                type="text"
                [ngModel]="departReturn()"
                (ngModelChange)="departReturn.set($event)"
                name="departReturn"
                class="w-full bg-transparent text-sm font-medium text-[#112211] outline-none"
              />
            </div>
          </div>

          <!-- Field 4: Passenger - Class -->
          <div class="relative">
            <label class="absolute -top-2.5 left-3 z-10 bg-white px-1 text-xs font-semibold text-[#112211]">
              Passenger - Class
            </label>
            <div class="flex h-[56px] items-center rounded-[4px] border border-[#79747E] bg-white px-3 py-2 transition-all focus-within:border-[#8DD3BB] focus-within:ring-1 focus-within:ring-[#8DD3BB]">
              <input
                type="text"
                [ngModel]="passengerClass()"
                (ngModelChange)="passengerClass.set($event)"
                name="passengerClass"
                class="w-full bg-transparent text-sm font-medium text-[#112211] outline-none"
              />
            </div>
          </div>

        </div>

        <!-- Bottom Action Bar: Promo Code & Submit Button -->
        <div class="mt-8 flex flex-col sm:flex-row items-center justify-end gap-6 pt-2">
          <!-- Promo Code Section -->
          <div class="flex items-center gap-3">
            @if (appliedPromo()) {
              <span class="inline-flex items-center gap-1.5 rounded-md bg-[#8DD3BB]/25 px-3 py-1.5 text-xs font-bold text-[#112211]">
                ✓ Code: {{ appliedPromo() }}
                <button type="button" (click)="appliedPromo.set(null)" class="ml-1 text-gray-600 hover:text-black">&times;</button>
              </span>
            } @else if (showPromoInput()) {
              <div class="flex items-center gap-2">
                <input
                  type="text"
                  [ngModel]="promoCode()"
                  (ngModelChange)="promoCode.set($event)"
                  name="promoCode"
                  placeholder="Enter code"
                  class="h-9 w-32 rounded-md border border-gray-300 px-3 text-xs uppercase font-medium text-[#112211] outline-none focus:border-[#8DD3BB]"
                />
                <button
                  type="button"
                  (click)="applyPromo()"
                  class="rounded-md bg-[#112211] px-3 py-1.5 text-xs font-semibold text-white hover:bg-black transition-colors"
                >
                  Apply
                </button>
              </div>
            } @else {
              <button
                type="button"
                (click)="togglePromo()"
                class="flex items-center gap-1.5 text-sm font-semibold text-[#112211] hover:text-[#74C0A3] transition-colors cursor-pointer"
              >
                <span class="text-base font-bold">+</span>
                <span>Add Promo Code</span>
              </button>
            }
          </div>

          <!-- Submit Action Button -->
          <button
            type="submit"
            class="w-full sm:w-auto inline-flex h-[48px] items-center justify-center gap-2 rounded-[4px] bg-[#8DD3BB] px-6 text-sm font-semibold text-[#112211] shadow-sm hover:bg-[#74C0A3] active:scale-[0.99] transition-all cursor-pointer"
          >
            <!-- Paper Plane Icon -->
            <svg class="h-4 w-4 fill-current rotate-45 transform" viewBox="0 0 24 24">
              <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
            <span>{{ activeTab() === 'flights' ? 'Show Flights' : 'Show Stays' }}</span>
          </button>
        </div>
      </form>
    </div>
  </section>
</div>
