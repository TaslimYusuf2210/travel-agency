<section class="mx-auto max-w-[1360px] px-4 pb-16 sm:px-6 lg:px-8">
  <div class="mb-6 flex items-end justify-between gap-4">
    <div>
      <h2 class="section-heading">Reviews</h2>
      <p class="section-subtitle">What people says about Golobe facilities</p>
    </div>

    <button
      type="button"
      class="section-button px-4 py-2 rounded-[12px] border-[1.5px]"
    >
      See All
    </button>
  </div>

  <div class="grid gap-6 lg:grid-cols-3">
    @for (review of reviews(); track review.author) {
      <app-review-card [review]="review" />
    }
  </div>
</section>
