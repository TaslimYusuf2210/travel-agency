<section class="mx-auto max-w-[1360px] px-4 pb-16 sm:px-6 lg:px-8">
  <div class="mb-6 flex items-end justify-between gap-4">
    <div>
      <h2 class="text-[2.1rem] font-extrabold tracking-[-0.07em] text-[#1d1d1f]">Reviews</h2>
      <p class="mt-2 text-[1.05rem] text-[#4b4b4b]">What people says about Golobe facilities</p>
    </div>

    <button
      type="button"
      class="inline-flex items-center justify-center rounded-[12px] border border-[#dfe5e1] bg-transparent px-4 py-2 text-[0.9rem] font-medium text-[#1d1d1f] transition hover:bg-[#edf6f2]"
    >
      See All
    </button>
  </div>

  <div class="grid gap-6 lg:grid-cols-3">
    @for (review of reviews(); track review.author) {
      <app-review-card [review]="review" />
    }
  </div>
</section>
