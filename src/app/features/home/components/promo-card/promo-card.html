<article class="group relative overflow-hidden rounded-[20px] border border-[#dfe5e1] bg-[#111827] shadow-sm">
  <img
    [ngSrc]="item.imageUrl"
    [alt]="item.title"
    width="1200"
    height="550"
    sizes="(min-width: 1024px) 50vw, 100vw"
    class="h-[550px] w-full object-cover object-center brightness-[0.8] transition duration-300 group-hover:scale-[1.02]"
  />

  <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/15 to-black/5"></div>

  <div class="absolute inset-x-0 bottom-0 flex justify-center px-6 pb-8 text-white sm:px-10 sm:pb-10">
    <div class="max-w-[420px] text-center">
      <h3 class="font-display text-[2.7rem] font-semibold tracking-[-0.0001em] text-white leading-none">
        {{ item.title }}
      </h3>
      <p class="mt-2 text-[1.08rem] font-light text-white/90 leading-snug">
        {{ item.description }}
      </p>

      <button
        type="button"
        class="mt-3 inline-flex items-center justify-center gap-3 rounded-[7px] bg-[#8DD3BB] px-5 py-3 text-base font-semibold text-[#112211] shadow-sm transition hover:bg-[#74C0A3] font-light"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 16 16" class="h-4 w-4" aria-hidden="true">
          <path d="M0 0h16v16H0z" fill="none" />
          <path fill="currentColor" d="M15.854.146a.5.5 0 0 1 .11.54l-5.819 14.547a.75.75 0 0 1-1.329.124l-3.178-4.995L.643 7.184a.75.75 0 0 1 .124-1.33L15.314.037a.5.5 0 0 1 .54.11ZM6.636 10.07l2.761 4.338L14.13 2.576zm6.787-8.201L1.591 6.602l4.339 2.76z" />
        </svg>
        {{ item.buttonLabel }}
      </button>
    </div>
  </div>
</article>
