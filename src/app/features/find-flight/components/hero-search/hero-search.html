<section class="relative overflow-hidden">
  <div
    class="absolute inset-0 bg-cover bg-center"
    style="background-image: url('/findFlightHero.jpg')"
    aria-hidden="true"
  ></div>
  <div class="absolute inset-0 bg-gradient-to-b from-black/60 via-black/30 to-black/50" aria-hidden="true"></div>

  <div class="relative z-10 mx-auto max-w-[1240px] px-4 pb-44 pt-8 sm:px-6 sm:pb-52 sm:pt-10">
    <h1 class="max-w-2xl text-4xl font-display font-extrabold leading-[1.08] text-white drop-shadow-md sm:text-5xl lg:text-[56px]">
      Make your travel
      <br class="hidden sm:block" />
      wishlist, we&rsquo;ll do
      <br class="hidden sm:block" />
      the rest
    </h1>
    <p class="mt-5 text-lg font-sans font-semibold text-white/90 sm:text-xl">
      Special offers to suit your plan
    </p>
  </div>

  <div class="relative z-30 mx-auto -mt-32 max-w-[1240px] px-4 sm:-mt-22 sm:px-6">
    <div class="rounded-[16px] border border-gray-100/80 bg-white p-6 shadow-[0_4px_30px_rgba(0,0,0,0.12)] backdrop-blur-sm sm:p-8">
      <p class="text-lg font-bold text-[#112211] sm:text-xl">Where are you flying?</p>

      <form (submit)="$event.preventDefault()" class="mt-6">
        <div class="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-4">
          <div class="relative">
            <label class="absolute -top-2.5 left-3 z-10 bg-white px-1 text-xs font-semibold text-[#112211]">
              From - To
            </label>
            <div class="flex h-[56px] items-center justify-between rounded-[4px] border border-[#79747E] bg-white px-3 py-2 transition-all focus-within:border-[#8DD3BB] focus-within:ring-1 focus-within:ring-[#8DD3BB]">
              <input
                type="text"
                [ngModel]="fromLocation() + ' - ' + toLocation()"
                (ngModelChange)="fromLocation.set($event)"
                name="fromTo"
                class="w-full bg-transparent text-sm font-medium text-[#112211] outline-none"
              />
              <button
                type="button"
                (click)="swapLocations()"
                title="Swap origin and destination"
                class="ml-2 flex h-8 w-8 shrink-0 cursor-pointer items-center justify-center rounded-full text-[#112211] transition-colors hover:bg-gray-100 hover:text-[#74C0A3]"
              >
                <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"
                  />
                </svg>
              </button>
            </div>
          </div>

          <div class="relative">
            <label class="absolute -top-2.5 left-3 z-10 bg-white px-1 text-xs font-semibold text-[#112211]">
              Trip
            </label>
            <div class="relative flex h-[56px] items-center rounded-[4px] border border-[#79747E] bg-white px-3 py-2 transition-all focus-within:border-[#8DD3BB] focus-within:ring-1 focus-within:ring-[#8DD3BB]">
              <select
                [ngModel]="tripType()"
                (ngModelChange)="tripType.set($event)"
                name="tripType"
                class="w-full cursor-pointer appearance-none bg-transparent pr-8 text-sm font-medium text-[#112211] outline-none"
              >
                <option value="Return">Return</option>
                <option value="One Way">One Way</option>
                <option value="Multi-City">Multi-City</option>
              </select>
              <div class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-[#112211]">
                <svg class="h-4 w-4 fill-current" viewBox="0 0 20 20">
                  <path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" />
                </svg>
              </div>
            </div>
          </div>

          <div class="relative">
            <label class="absolute -top-2.5 left-3 z-10 bg-white px-1 text-xs font-semibold text-[#112211]">
              Depart- Return
            </label>
            <div class="flex h-[56px] items-center rounded-[4px] border border-[#79747E] bg-white px-3 py-2 transition-all focus-within:border-[#8DD3BB] focus-within:ring-1 focus-within:ring-[#8DD3BB]">
              <input
                type="text"
                [ngModel]="departReturn()"
                (ngModelChange)="departReturn.set($event)"
                name="departReturn"
                class="w-full bg-transparent text-sm font-medium text-[#112211] outline-none"
              />
            </div>
          </div>

          <div class="relative">
            <label class="absolute -top-2.5 left-3 z-10 bg-white px-1 text-xs font-semibold text-[#112211]">
              Passenger - Class
            </label>
            <div class="flex h-[56px] items-center rounded-[4px] border border-[#79747E] bg-white px-3 py-2 transition-all focus-within:border-[#8DD3BB] focus-within:ring-1 focus-within:ring-[#8DD3BB]">
              <input
                type="text"
                [ngModel]="passengerClass()"
                (ngModelChange)="passengerClass.set($event)"
                name="passengerClass"
                class="w-full bg-transparent text-sm font-medium text-[#112211] outline-none"
              />
            </div>
          </div>
        </div>

        <div class="mt-8 flex flex-col items-center justify-end gap-6 pt-2 sm:flex-row">
          <div class="flex items-center gap-3">
            @if (appliedPromo()) {
              <span class="inline-flex items-center gap-1.5 rounded-md bg-[#8DD3BB]/25 px-3 py-1.5 text-xs font-bold text-[#112211]">
                ✓ Code: {{ appliedPromo() }}
                <button type="button" (click)="appliedPromo.set(null)" class="ml-1 cursor-pointer text-gray-600 hover:text-black">
                  &times;
                </button>
              </span>
            } @else if (showPromoInput()) {
              <div class="flex items-center gap-2">
                <input
                  type="text"
                  [ngModel]="promoCode()"
                  (ngModelChange)="promoCode.set($event)"
                  name="promoCode"
                  placeholder="Enter code"
                  class="h-9 w-32 rounded-md border border-gray-300 px-3 text-xs font-medium uppercase text-[#112211] outline-none focus:border-[#8DD3BB]"
                />
                <button type="button" (click)="applyPromo()" class="cursor-pointer rounded-md bg-[#112211] px-3 py-1.5 text-xs font-semibold text-white transition-colors hover:bg-black">
                  Apply
                </button>
              </div>
            } @else {
              <button type="button" (click)="togglePromo()" class="flex cursor-pointer items-center gap-1.5 text-sm font-semibold text-[#112211] transition-colors hover:text-[#74C0A3]">
                <span class="text-base font-bold">+</span>
                <span>Add Promo Code</span>
              </button>
            }
          </div>

          <button
            type="submit"
            class="inline-flex h-[48px] w-full cursor-pointer items-center justify-center gap-2 rounded-[4px] bg-[#8DD3BB] px-6 text-sm font-semibold text-[#112211] shadow-sm transition-all hover:bg-[#74C0A3] active:scale-[0.99] sm:w-auto"
          >
            <svg class="h-4 w-4 rotate-45 fill-current" viewBox="0 0 24 24">
              <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
            </svg>
            <span>Show Flights</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</section>
